
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Talks Today</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #007bff;
        }
        .filters {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #search-box {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            font-size: 1em;
        }
        #category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .category-tag {
            background-color: #e9ecef;
            color: #007bff;
            padding: 8px 12px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .category-tag:hover {
            background-color: #d0e7ff;
        }
        .category-tag.active {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .schedule {
            position: relative;
            padding: 20px 0;
        }
        .schedule::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ddd;
        }
        .schedule-item {
            position: relative;
            margin-bottom: 30px;
            padding-left: 60px;
        }
        .schedule-time {
            position: absolute;
            left: -15px;
            top: 5px;
            font-weight: bold;
            color: #007bff;
            background-color: #f8f9fa;
            padding: 5px;
            font-size: 0.9em;
            width: 60px;
            text-align: right;
        }
        .talk-card, .break-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .talk-card h2 {
            margin-top: 0;
            font-size: 1.4em;
            color: #343a40;
        }
        .talk-card .speakers {
            font-style: italic;
            color: #6c757d;
            margin-bottom: 15px;
        }
        .talk-card .description {
            line-height: 1.6;
        }
        .talk-card .categories {
            margin-top: 15px;
        }
        .talk-card .category {
            display: inline-block;
            background: #f1f3f5;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-right: 5px;
        }
        .break-card {
            background-color: #e9f5ff;
            text-align: center;
            font-size: 1.1em;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tech Talks Today</h1>
        </header>

        <div class="filters">
            <input type="text" id="search-box" placeholder="Search by category (e.g., AI, JavaScript)...">
            <div id="category-filters"></div>
        </div>

        <div id="schedule" class="schedule"></div>
    </div>

    <script>
        const talks = [
            {
                title: "The Future of AI in Web Development",
                speakers: ["Dr. Evelyn Reed"],
                categories: ["AI", "WebDev", "FutureTech"],
                description: "An in-depth look at how artificial intelligence is shaping the future of web development, from automated coding to personalized user experiences."
            },
            {
                title: "Mastering Modern JavaScript",
                speakers: ["John Archer", "Jane Doe"],
                categories: ["JavaScript", "Frontend"],
                description: "This talk covers the latest features in ECMAScript, offering practical tips and advanced techniques for writing cleaner and more efficient code."
            },
            {
                title: "Scalable CSS: Architectures and Methodologies",
                speakers: ["Samantha Blue"],
                categories: ["CSS", "Frontend", "Architecture"],
                description: "Learn how to write maintainable and scalable CSS for large applications using modern methodologies like BEM, ITCSS, and CSS-in-JS."
            },
            {
                title: "Introduction to Quantum Computing",
                speakers: ["Kenji Tanaka"],
                categories: ["Quantum", "FutureTech"],
                description: "A beginner-friendly introduction to the mind-bending world of quantum computing. We'll explore the basic principles and potential applications."
            },
            {
                title: "DevOps for Developers: A Practical Guide",
                speakers: ["Maria Garcia"],
                categories: ["DevOps", "Cloud", "Architecture"],
                description: "This session demystifies DevOps, providing developers with a practical roadmap for integrating CI/CD pipelines and infrastructure as code into their workflow."
            },
            {
                title: "The Rise of WebAssembly",
                speakers: ["David Chen", "Emily White"],
                categories: ["WebAssembly", "Performance", "WebDev"],
                description: "Discover how WebAssembly is unlocking near-native performance in the browser and explore use cases beyond just gaming and heavy computation."
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const scheduleContainer = document.getElementById('schedule');
            const searchBox = document.getElementById('search-box');
            const categoryFiltersContainer = document.getElementById('category-filters');
            
            let activeCategory = null;

            const formatTime = (date) => {
                return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            };

            const generateSchedule = (filteredTalks) => {
                scheduleContainer.innerHTML = '';
                let currentTime = new Date();
                currentTime.setHours(10, 0, 0, 0); // Event starts at 10:00 AM

                const talkDuration = 60; // minutes
                const transitionTime = 10; // minutes
                const lunchBreakDuration = 60; // minutes

                let talkCounter = 0;
                while (talkCounter < filteredTalks.length) {
                    // Check for lunch break after the 3rd original talk index
                    const originalIndex = talks.indexOf(filteredTalks[talkCounter]);
                    if (originalIndex === 3) {
                         const breakStartTime = new Date(currentTime);
                         currentTime.setMinutes(currentTime.getMinutes() + lunchBreakDuration);
                         const breakEndTime = new Date(currentTime);
                         
                         const breakElement = document.createElement('div');
                         breakElement.className = 'schedule-item';
                         breakElement.innerHTML = `
                             <div class="schedule-time">${formatTime(breakStartTime)}</div>
                             <div class="break-card">
                                 Lunch Break (${formatTime(breakStartTime)} - ${formatTime(breakEndTime)})
                             </div>
                         `;
                         scheduleContainer.appendChild(breakElement);
                    }

                    const talk = filteredTalks[talkCounter];
                    const startTime = new Date(currentTime);
                    currentTime.setMinutes(currentTime.getMinutes() + talkDuration);
                    const endTime = new Date(currentTime);

                    const talkElement = document.createElement('div');
                    talkElement.className = 'schedule-item';
                    talkElement.innerHTML = `
                        <div class="schedule-time">${formatTime(startTime)}</div>
                        <div class="talk-card">
                            <h2>${talk.title}</h2>
                            <div class="speakers">${talk.speakers.join(', ')}</div>
                            <div class="description">${talk.description}</div>
                            <div class="categories">
                                ${talk.categories.map(cat => `<span class="category">${cat}</span>`).join('')}
                            </div>
                        </div>
                    `;
                    scheduleContainer.appendChild(talkElement);
                    
                    talkCounter++;

                    // Add transition time if it's not the last talk
                    if (talkCounter < filteredTalks.length) {
                        currentTime.setMinutes(currentTime.getMinutes() + transitionTime);
                    }
                }
            };
            
            const renderCategoryFilters = () => {
                const allCategories = [...new Set(talks.flatMap(talk => talk.categories))];
                allCategories.sort();
                categoryFiltersContainer.innerHTML = allCategories.map(cat => 
                    `<div class="category-tag" data-category="${cat}">${cat}</div>`
                ).join('');

                document.querySelectorAll('.category-tag').forEach(tag => {
                    tag.addEventListener('click', () => {
                        const category = tag.dataset.category;
                        
                        // Deactivate current active tag
                        const currentActive = document.querySelector('.category-tag.active');
                        if (currentActive) {
                            currentActive.classList.remove('active');
                        }

                        if (activeCategory === category) {
                            activeCategory = null; // Toggle off
                            searchBox.value = '';
                        } else {
                            activeCategory = category;
                            searchBox.value = category;
                            tag.classList.add('active');
                        }
                        
                        filterAndRender();
                    });
                });
            };

            const filterAndRender = () => {
                const searchTerm = searchBox.value.toLowerCase();
                const filteredTalks = talks.filter(talk => 
                    talk.categories.some(cat => cat.toLowerCase().includes(searchTerm))
                );
                generateSchedule(filteredTalks);
            };

            searchBox.addEventListener('input', () => {
                activeCategory = null;
                const currentActive = document.querySelector('.category-tag.active');
                if (currentActive) {
                    currentActive.classList.remove('active');
                }
                filterAndRender();
            });

            // Initial render
            renderCategoryFilters();
            generateSchedule(talks);
        });
    </script>
</body>
</html>
